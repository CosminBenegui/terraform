name: Terraform plan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, terraform-vm]
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      PROJECT_DIR: /home/cosmin/terraform-project
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Plan against a copy of state
        run: |
          set -euo pipefail
          PLAN_DIR="$(mktemp -d)"
          cleanup() { rm -rf "$PLAN_DIR"; }
          trap cleanup EXIT
          cp -a . "$PLAN_DIR"/
          rm -rf "$PLAN_DIR/.git"
          if [ -d "$PROJECT_DIR/terraform.tfstate.d" ]; then
            cp -a "$PROJECT_DIR/terraform.tfstate.d" "$PLAN_DIR/"
          fi
          if [ -f "$PROJECT_DIR/terraform.tfstate" ]; then
            cp "$PROJECT_DIR/terraform.tfstate" "$PLAN_DIR/terraform.tfstate"
          fi
          cd "$PLAN_DIR"
          if [ ! -r /home/cosmin/.config/lab/secrets.env ]; then
            sudo chown cosmin:cosmin /home/cosmin/.config/lab/secrets.env
            sudo chmod 600 /home/cosmin/.config/lab/secrets.env
          fi
          test -r /home/cosmin/.config/lab/secrets.env
          terraform init -input=false
          terraform workspace select test
          terraform plan -input=false -no-color -lock=false | tee "$RUNNER_TEMP/terraform-plan.txt"

      - name: Start the agents with the plan
        env:
          PLAN_FILE: ${{ runner.temp }}/terraform-plan.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          plan_path = os.environ["PLAN_FILE"]
          with open(plan_path, encoding="utf-8", errors="replace") as handle:
              text = handle.read()
          if len(text) > 50000:
              text = text[:50000] + "\n\n[plan truncated]"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Terraform plan\n\n```\n")
                  handle.write(text)
                  handle.write("\n```\n")
          token = os.environ.get("GITHUB_TOKEN", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          number = os.environ.get("PR_NUMBER", "")
          if not token or not repo or not number:
              raise SystemExit("missing GitHub comment target")
          body = "\n".join([
              "@pipeline-relay The pull request plan is ready. Start here.",
              "Call ask_platform, then ask_network, then post_note.",
              "Do not call hand_to_coder. Do not apply.",
              "",
              "```",
              text,
              "```",
          ])
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{number}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              response.read()
          PY
