name: Terraform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Plan only or apply
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

jobs:
  terraform:
    runs-on: [self-hosted, terraform-vm]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      PROJECT_DIR: /home/cosmin/terraform-project

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure Docker
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker..."
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io \
              || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-ce docker-ce-cli containerd.io
          fi
          sudo systemctl enable --now docker
          sudo usermod -aG docker "$USER" || true
          # Runner systemd process often lacks docker group until restart.
          # Lab: open socket for this job every run.
          sudo chmod 666 /var/run/docker.sock
          docker version
          docker ps

      - name: Ensure Terraform
        run: |
          set -euo pipefail
          if command -v terraform >/dev/null 2>&1; then
            terraform version
            exit 0
          fi
          echo "Installing Terraform..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl unzip
          curl -fsSL -o /tmp/terraform.zip \
            https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/terraform
          rm -f /tmp/terraform.zip
          terraform version

      - name: Prepare Terraform working directory
        run: |
          # Keep Terraform state on a stable path on the VM (not the runner _work folder).
          mkdir -p "$PROJECT_DIR"
          find "$PROJECT_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.terraform' \
            ! -name 'terraform.tfstate' \
            ! -name 'terraform.tfstate.backup' \
            ! -name 'terraform.tfstate.d' \
            ! -name 'hello-*.txt' \
            -exec rm -rf {} +
          cp -a . "$PROJECT_DIR"/
          rm -rf "$PROJECT_DIR/.git"

      - name: Ensure media host folders
        run: mkdir -p /home/cosmin/media/{movies,tv,downloads}

      - name: Terraform init
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform init -upgrade

      - name: Select workspace test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          terraform workspace select test || terraform workspace new test

      - name: Terraform plan
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform plan -out=tfplan -input=false

      - name: Terraform apply
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Show outputs
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform output
