name: Terraform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Plan only or apply
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

jobs:
  terraform:
    runs-on: [self-hosted, terraform-vm]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Line-buffered stdout so the Actions log updates while the step is still running.
      PYTHONUNBUFFERED: "1"
      PROJECT_DIR: /home/cosmin/terraform-project

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Terraform working directory
        run: |
          # Keep Terraform state on a stable path on the VM (not the runner _work folder).
          mkdir -p "$PROJECT_DIR"
          find "$PROJECT_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.terraform' \
            ! -name 'terraform.tfstate' \
            ! -name 'terraform.tfstate.backup' \
            ! -name 'terraform.tfstate.d' \
            ! -name 'hello-*.txt' \
            -exec rm -rf {} +
          cp -a . "$PROJECT_DIR"/
          rm -rf "$PROJECT_DIR/.git"

      - name: Ensure Windows Server ISO exists
        run: |
          SRC=/home/cosmin/Downloads/SERVER_EVAL_x64FRE_en-us.iso
          DST=/var/lib/libvirt/images/SERVER_EVAL_x64FRE_en-us.iso
          if [ ! -f "$SRC" ]; then
            echo "Missing $SRC — place the Eval ISO on the bare-metal host before apply."
            exit 1
          fi
          # Destroy removes this directory with the pool. Recreate it before the copy.
          sudo mkdir -p /var/lib/libvirt/images
          # QEMU runs as libvirt-qemu and cannot traverse /home/cosmin — stage into the pool.
          if [ ! -f "$DST" ]; then
            sudo cp "$SRC" "$DST"
          fi
          sudo chown libvirt-qemu:kvm "$DST"
          sudo chmod 644 "$DST"
          ls -lh "$SRC" "$DST"

      # libvirt_domain xml { xslt = ... } needs xsltproc on the runner host.
      - name: Ensure xsltproc
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq
          sudo apt-get install -y xsltproc
          xsltproc --version | head -1

      # QEMU "Permission denied" on pool volumes is AppArmor; disable libvirt security driver on this lab host.
      - name: Disable libvirt AppArmor security driver
        run: |
          if ! sudo grep -qE '^security_driver\s*=\s*"none"' /etc/libvirt/qemu.conf; then
            echo 'security_driver = "none"' | sudo tee -a /etc/libvirt/qemu.conf
            sudo systemctl restart libvirtd
            sleep 2
          fi
          sudo grep -E '^security_driver' /etc/libvirt/qemu.conf

      - name: Terraform init
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform init -upgrade

      - name: Select workspace test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          terraform workspace select test || terraform workspace new test

      # Orphans from failed creates sit outside TF state; must use qemu:///system (not session).
      - name: Cleanup orphan Windows libvirt domains
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          URI=qemu:///system
          for dom in windows-srv windows-server-test; do
            virsh -c "$URI" destroy "$dom" 2>/dev/null || true
            virsh -c "$URI" undefine "$dom" --nvram 2>/dev/null || virsh -c "$URI" undefine "$dom" 2>/dev/null || true
          done
          # Failed create leaves windows-srv-test defined but absent from state — clear only then.
          if ! terraform state list 2>/dev/null | grep -qx 'libvirt_domain.windows_server'; then
            virsh -c "$URI" destroy windows-srv-test 2>/dev/null || true
            virsh -c "$URI" undefine windows-srv-test --nvram 2>/dev/null || virsh -c "$URI" undefine windows-srv-test 2>/dev/null || true
          fi
          for img in /var/lib/libvirt/images/windows-srv-disk-*.qcow2 \
                     /var/lib/libvirt/images/windows-server-os-*.qcow2; do
            [ -e "$img" ] || continue
            sudo chown libvirt-qemu:kvm "$img"
            sudo chmod 660 "$img"
            ls -la "$img"
          done
          # Domain create fails when this network is defined but inactive.
          virsh -c "$URI" net-start win-internal-test 2>/dev/null || true
          virsh -c "$URI" net-autostart win-internal-test 2>/dev/null || true
          virsh -c "$URI" net-start default 2>/dev/null || true
          virsh -c "$URI" net-list --all
          # Volume create fails while the default pool is defined but inactive.
          virsh -c "$URI" pool-start default 2>/dev/null || true
          virsh -c "$URI" pool-autostart default 2>/dev/null || true
          virsh -c "$URI" pool-list --all

      - name: Terraform plan
        working-directory: ${{ env.PROJECT_DIR }}
        run: stdbuf -oL -eL terraform plan -out=tfplan -input=false

      - name: Ensure Ansible is installed
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq
          sudo apt-get install -y ansible
          ansible-playbook --version | head -1

      - name: Terraform apply
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: ${{ env.PROJECT_DIR }}
        run: stdbuf -oL -eL terraform apply -auto-approve -input=false tfplan

      - name: Show outputs
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform output
