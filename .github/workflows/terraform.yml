name: Terraform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Plan only or apply
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

jobs:
  terraform:
    runs-on: [self-hosted, terraform-vm]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      PROJECT_DIR: /home/cosmin/terraform-project

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Terraform working directory
        run: |
          # Keep Terraform state on a stable path on the VM (not the runner _work folder).
          mkdir -p "$PROJECT_DIR"
          find "$PROJECT_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.terraform' \
            ! -name 'terraform.tfstate' \
            ! -name 'terraform.tfstate.backup' \
            ! -name 'terraform.tfstate.d' \
            ! -name 'hello-*.txt' \
            -exec rm -rf {} +
          cp -a . "$PROJECT_DIR"/
          rm -rf "$PROJECT_DIR/.git"

      - name: Terraform init
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform init -upgrade

      - name: Select workspace test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          terraform workspace select test || terraform workspace new test

      - name: Terraform plan
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform plan -out=tfplan -input=false

      - name: Terraform apply
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Show outputs
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: ${{ env.PROJECT_DIR }}
        run: terraform output
