---
- name: Ensure the Traefik directory exists
  ansible.builtin.file:
    path: /var/lib/lab/compose/traefik
    state: directory
    mode: "0755"

- name: Install openssl for the lab certificate
  ansible.builtin.apt:
    name: openssl
    state: present

- name: Ensure lab certificate directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/lab/compose/traefik/certs
    - /var/lib/lab/certs

- name: Issue the lab CA when it is missing
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:2048
      - -sha256
      - -days
      - "3650"
      - -nodes
      - -keyout
      - /var/lib/lab/compose/traefik/certs/lab-ca.key
      - -out
      - /var/lib/lab/compose/traefik/certs/lab-ca.crt
      - -subj
      - /CN=lab.home CA
    creates: /var/lib/lab/compose/traefik/certs/lab-ca.crt

- name: Write the lab certificate names
  ansible.builtin.copy:
    dest: /var/lib/lab/compose/traefik/certs/lab.home.ext
    mode: "0644"
    content: |
      subjectAltName=DNS:*.lab.home,DNS:lab.home,IP:192.168.0.120
      extendedKeyUsage=serverAuth
      keyUsage=digitalSignature,keyEncipherment

- name: Issue the lab certificate when it is missing
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      openssl req -newkey rsa:2048 -nodes \
        -keyout /var/lib/lab/compose/traefik/certs/lab.home.key \
        -out /var/lib/lab/compose/traefik/certs/lab.home.csr \
        -subj /CN=lab.home
      openssl x509 -req \
        -in /var/lib/lab/compose/traefik/certs/lab.home.csr \
        -CA /var/lib/lab/compose/traefik/certs/lab-ca.crt \
        -CAkey /var/lib/lab/compose/traefik/certs/lab-ca.key \
        -CAcreateserial \
        -out /var/lib/lab/compose/traefik/certs/lab.home.crt \
        -days 825 -sha256 \
        -extfile /var/lib/lab/compose/traefik/certs/lab.home.ext
    args:
      creates: /var/lib/lab/compose/traefik/certs/lab.home.crt

- name: Lock down lab certificate permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/lab/compose/traefik/certs/lab-ca.key, mode: "0600" }
    - { path: /var/lib/lab/compose/traefik/certs/lab.home.key, mode: "0600" }
    - { path: /var/lib/lab/compose/traefik/certs/lab-ca.crt, mode: "0644" }
    - { path: /var/lib/lab/compose/traefik/certs/lab.home.crt, mode: "0644" }

- name: Publish the lab CA for clients
  ansible.builtin.copy:
    src: /var/lib/lab/compose/traefik/certs/lab-ca.crt
    dest: /var/lib/lab/certs/lab-ca.crt
    remote_src: true
    mode: "0644"

- name: Render Traefik config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/var/lib/lab/compose/traefik/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: traefik.yml.j2, dest: traefik.yml }
    - { src: dynamic.yml.j2, dest: dynamic.yml }
