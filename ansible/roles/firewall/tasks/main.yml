---
# This role only adds allow rules when ufw is already enforcing.
- name: Read ufw status
  ansible.builtin.command: ufw status
  register: ufw_status
  changed_when: false
  failed_when: false

- name: Allow lab ports when ufw is already enforcing
  ansible.builtin.command: ufw allow {{ item }}
  loop:
    - 22/tcp
    - 80/tcp
    - 443/tcp
    - 32400/tcp
    - 5900/tcp
    - 61208/tcp
    - 6881/tcp
    - 6881/udp
  when: "ufw_status.rc == 0 and 'Status: active' in ufw_status.stdout"
  changed_when: true
