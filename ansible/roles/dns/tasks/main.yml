---
- name: Resolve lab names on this host
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE LAB.HOME"
    block: |
      192.168.0.120 radarr.lab.home sonarr.lab.home prowlarr.lab.home seerr.lab.home qbit.lab.home auth.lab.home traefik.lab.home monitor.lab.home

- name: Install dnsmasq for LAN clients
  ansible.builtin.apt:
    name: dnsmasq
    state: present

- name: Keep dnsmasq off the host resolver
  ansible.builtin.lineinfile:
    path: /etc/default/dnsmasq
    regexp: '^IGNORE_RESOLVCONF='
    line: IGNORE_RESOLVCONF=yes
    create: true
    mode: "0644"

- name: Serve *.lab.home on the LAN address only
  ansible.builtin.copy:
    dest: /etc/dnsmasq.d/lab-home.conf
    mode: "0644"
    content: |
      # Do not bind 127.0.0.1 — systemd-resolved keeps the host resolver.
      listen-address=192.168.0.120
      bind-interfaces
      except-interface=lo
      address=/lab.home/192.168.0.120
      server=9.9.9.9
  register: dnsmasq_conf

- name: Restart dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    state: restarted
    enabled: true
  when: dnsmasq_conf.changed
  register: dnsmasq_restart
  failed_when: false

- name: Continue when dnsmasq cannot bind
  ansible.builtin.debug:
    msg: >-
      dnsmasq did not start. Host /etc/hosts still has the lab names.
      Authentik and the media links still run. Point clients at 192.168.0.120 only after dnsmasq is listening.
  when: dnsmasq_restart.failed | default(false)
