---
- name: Wait until Radarr answers
  ansible.builtin.command: docker exec radarr curl -sf http://127.0.0.1:7878/ping
  register: radarr_ping
  retries: 12
  delay: 5
  until: radarr_ping.rc == 0
  changed_when: false

- name: Wait until Sonarr answers
  ansible.builtin.command: docker exec sonarr curl -sf http://127.0.0.1:8989/ping
  register: sonarr_ping
  retries: 12
  delay: 5
  until: sonarr_ping.rc == 0
  changed_when: false

- name: Wait until Prowlarr answers
  ansible.builtin.command: docker exec prowlarr curl -sf http://127.0.0.1:9696/ping
  register: prowlarr_ping
  retries: 12
  delay: 5
  until: prowlarr_ping.rc == 0
  changed_when: false

- name: Link media apps
  ansible.builtin.script: link_media.py
  args:
    executable: python3
  register: media_links
  changed_when: "'created' in media_links.stdout or 'updated' in media_links.stdout"
