---
- name: Ensure the Grafana compose directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/lab/compose/grafana
    - /var/lib/lab/compose/grafana/provisioning/datasources
    - /var/lib/lab/compose/grafana/provisioning/dashboards

- name: Install Grafana, Loki, Prometheus, and Alloy config
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/var/lib/lab/compose/grafana/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: loki.yml, dest: loki.yml }
    - { src: prometheus.yml, dest: prometheus.yml }
    - { src: config.alloy, dest: config.alloy }
    - { src: provisioning/datasources/datasources.yml, dest: provisioning/datasources/datasources.yml }
    - { src: provisioning/dashboards/dashboards.yml, dest: provisioning/dashboards/dashboards.yml }
    - { src: provisioning/dashboards/lab.json, dest: provisioning/dashboards/lab.json }

