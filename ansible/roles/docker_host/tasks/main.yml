---
- name: Check whether Docker is already installed
  ansible.builtin.command: docker version
  register: docker_version
  changed_when: false
  failed_when: false

- name: Install Docker when the engine is missing
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
  when: docker_version.rc != 0

- name: Check whether Docker Compose is available
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false
  failed_when: false

- name: Install the Compose plugin
  ansible.builtin.apt:
    name: docker-compose-v2
    state: present
  when: compose_version.rc != 0

- name: Ensure cosmin can talk to the Docker socket
  ansible.builtin.user:
    name: cosmin
    groups: docker
    append: true

- name: Remove the retired Netdata container and files
  ansible.builtin.shell: |
    set -euo pipefail
    docker rm -f netdata >/dev/null 2>&1 || true
    docker volume rm -f monitor_netdata-config monitor_netdata-lib monitor_netdata-cache >/dev/null 2>&1 || true
    rm -rf /var/lib/lab/compose/monitor
  args:
    executable: /bin/bash
  changed_when: false
