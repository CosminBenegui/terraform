---
- name: Install libvirt clients used by Terraform
  ansible.builtin.apt:
    name:
      - libvirt-clients
      - libvirt-daemon-system
      - qemu-utils
    state: present

- name: Allow QEMU to read pool images
  ansible.builtin.lineinfile:
    path: /etc/libvirt/qemu.conf
    regexp: '^security_driver\s*='
    line: 'security_driver = "none"'
    create: false

- name: Keep the ISO readable by libvirt-qemu
  ansible.builtin.file:
    path: /var/lib/libvirt/images/SERVER_EVAL_x64FRE_en-us.iso
    owner: libvirt-qemu
    group: kvm
    mode: "0644"
  failed_when: false
