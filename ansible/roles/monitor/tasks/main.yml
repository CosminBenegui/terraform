---
- name: Ensure the Glances compose directory exists
  ansible.builtin.file:
    path: /var/lib/lab/compose/monitor
    state: directory
    mode: "0755"

- name: Render the Glances config
  ansible.builtin.template:
    src: glances.conf.j2
    dest: /var/lib/lab/compose/monitor/glances.conf
    mode: "0644"
