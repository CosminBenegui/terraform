---
# Host config and files. Terraform creates the containers and the Windows VM after this.
- name: Prepare the Debian lab host
  hosts: debian
  become: true
  roles:
    - base
    - docker_host
    - libvirt_host
    - dns
    - firewall
    - media_stack
    - monitor
    - grafana
    - authentik
    - traefik
